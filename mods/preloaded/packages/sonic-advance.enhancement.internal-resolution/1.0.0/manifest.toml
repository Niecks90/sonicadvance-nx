format_version = 1
id = "sonic-advance.enhancement.internal-resolution"
version = "1.0.0"
name = "Sonic Advance Higher Internal Resolution"
author = "Niecks90"
description = "Render the game with finer internal samples while keeping the original sprites and HUD artwork at native resolution."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "sonic-advance-us"
rom_sha1 = "d842afa7dd1e84de08addb94a51506f1bcafd551"

[[feature]]
id = "internal-resolution"
name = "Higher Internal Resolution"
description = "Add detail to the rendered output. Menus and original artwork retain their authored pixels. Up to 4x is recommended. 8x and above are experimental and may run slowly."
group = "Graphics"
default_enabled = false

[[option]]
feature = "internal-resolution"
id = "scale"
label = "Internal resolution"
type = "choice"
default = "4"

[[option.choice]]
value = "2"
label = "2x"

[[option.choice]]
value = "3"
label = "3x"

[[option.choice]]
value = "4"
label = "4x"

[[option.choice]]
value = "8"
label = "8x (experimental)"

[[option.choice]]
value = "16"
label = "16x (experimental)"

[[plugin]]
feature = "internal-resolution"
id = "sonic-advance.internal-resolution"
